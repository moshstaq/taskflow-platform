name: notification-service

on:
    push:
        branches: [ main ]
        paths:
            - "services/notification-service/**"
            - "charts/notification-service/**"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/service-deploy.yml
        with:
            service_name: notification-service
        secrets: inherit
