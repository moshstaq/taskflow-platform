apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Workload identity: links this ServiceAccount to the Azure managed identity.
    # The client ID comes from Terraform output mi_api_service_client_id.
    # The bindings tier creates a federated credential matching this SA name
    # and namespace — subject: system:serviceaccount:<namespace>:api-service
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}